<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
<title>安潔國際 - 工程記帳</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0f172a;font-family:'Noto Sans TC',sans-serif;color:#e2e8f0;padding-bottom:40px}
input,select,textarea{font-family:inherit;-webkit-appearance:none;appearance:none;background:#0f172a;border:1px solid #1e293b;border-radius:9px;padding:11px 12px;color:#e2e8f0;font-size:15px;width:100%;display:block}
input:focus,select:focus,textarea:focus{outline:none;border-color:#38bdf8}
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{resize:vertical}
select option{background:#1e293b}
button{cursor:pointer;font-family:inherit;border:none}
.page{max-width:480px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 12px;border-bottom:1px solid #1e293b;position:sticky;top:0;background:#0f172a;z-index:20}
.tabs{display:flex;border-bottom:1px solid #1e293b;position:sticky;top:57px;background:#0f172a;z-index:19}
.tab{flex:1;background:none;border:none;color:#475569;padding:12px 0;font-size:13px;font-weight:500;cursor:pointer;text-align:center}
.tab.active{color:#38bdf8;border-bottom:2px solid #38bdf8;font-weight:700}
.body{padding:12px 12px 24px}
.card{background:#1e293b;border-radius:14px;margin-bottom:10px;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:14px;cursor:pointer;user-select:none}
.card-body{border-top:1px solid #0f172a;padding:14px}
.badge{border-radius:20px;padding:3px 9px;font-size:11px;font-weight:700}
.chip{border-radius:20px;padding:3px 9px;font-size:12px;font-weight:800}
.btn-primary{background:#3b82f6;color:#fff;border-radius:20px;padding:10px 16px;font-size:14px;font-weight:700;white-space:nowrap}
.btn-save{flex:1;background:#3b82f6;color:#fff;border-radius:10px;padding:13px;font-weight:700;font-size:15px;text-align:center;cursor:pointer}
.btn-cancel{background:transparent;color:#475569;border:1px solid #334155;border-radius:10px;padding:13px 16px;font-size:14px;cursor:pointer}
.st-btn{background:transparent;color:#475569;border:1px solid #334155;border-radius:20px;padding:7px 16px;font-size:13px;cursor:pointer;display:inline-block}
.filter-chip{background:transparent;color:#475569;border:1px solid #334155;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer}
.filter-chip.active{background:#3b82f622;color:#60a5fa;border-color:#3b82f6}
.del-btn{background:#1a0a0a;border:1px solid #f8717140;border-radius:10px;padding:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;margin-top:14px}
.del-confirm{display:flex;gap:8px;align-items:center;margin-top:14px;padding:14px;background:#2d0f0f;border-radius:12px;border:1px solid #f8717140}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.flabel{margin-bottom:10px}
.flabel-text{font-size:11px;color:#64748b;margin-bottom:5px}
.exp-sec{background:#0f172a;border-radius:11px;padding:10px;margin-bottom:12px}
.exp-line{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #1e293b}
.hero{background:linear-gradient(135deg,#1a3a5c,#1e293b);border-radius:16px;padding:24px 20px;margin-bottom:12px;text-align:center;border:1px solid #1e4a7f35}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:4px}
.stat-card{background:#1e293b;border-radius:12px;padding:13px 14px}
.sec-title{font-size:10px;color:#475569;letter-spacing:.08em;text-transform:uppercase;margin-bottom:8px;margin-top:16px}
.pbox{background:#0f172a;border-radius:11px;padding:13px 14px;margin-bottom:14px}
.add-form{background:#1e293b;border-radius:14px;padding:16px 14px;border:1px solid #334155;margin-bottom:12px}
</style>
</head>
<body>
<div class="page" id="app">
  <div style="text-align:center;padding:80px 0;color:#475569">
    <div style="font-size:40px;margin-bottom:12px">🧹</div>
    <div>載入中…</div>
  </div>
</div>
<script>
const SC={"待收":"#f59e0b","部分":"#60a5fa","完收":"#34d399"};
const CATS=["材料","人工","交通","耗材","其他"];
const STATUS=["待收","部分","完收"];

let state={
  jobs:[],loading:true,syncing:false,
  tab:"總覽",adding:false,draft:null,
  open:null,filter:"全部",
  addExp:{cat:"材料",desc:"",amt:"",qty:"",unitPrice:""},
  delConfirm:null
};

function uid(){return Math.random().toString(36).slice(2,9)}
function fmt(n){return Number(n||0).toLocaleString("zh-TW")}
function today(){return new Date().toISOString().slice(0,10)}
function xp(job){return (job.exps||[]).reduce((s,e)=>s+(+e.amt),0)}

async function apiLoad(){
  try{const r=await fetch("/api/jobs");const d=await r.json();return Array.isArray(d)?d:[];}
  catch(e){return []}
}
async function apiSave(jobs){
  try{await fetch("/api/jobs",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({jobs})});}
  catch(e){}
}

function setState(patch){
  Object.assign(state,patch);
  render();
}

function setJobs(newJobs){
  state.jobs=newJobs;
  state.syncing=true;
  render();
  apiSave(newJobs).then(()=>{state.syncing=false;render()});
}

function h(tag,attrs,children){
  const el=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object"){Object.assign(el.style,v)}
    else if(k.startsWith("on")&&typeof v==="function"){el.addEventListener(k.slice(2).toLowerCase(),v)}
    else if(k==="className"){el.className=v}
    else if(k==="checked"){el.checked=v}
    else if(k==="value"&&(tag==="input"||tag==="select"||tag==="textarea")){el.value=v||""}
    else{el.setAttribute(k,v)}
  });
  (Array.isArray(children)?children.flat():[children]).forEach(c=>{
    if(c==null||c===false)return;
    el.appendChild(typeof c==="string"||typeof c==="number"?document.createTextNode(c):c);
  });
  return el;
}

function FL(label,child){
  const d=document.createElement("div");d.className="flabel";
  const l=document.createElement("div");l.className="flabel-text";l.textContent=label;
  d.appendChild(l);d.appendChild(child);return d;
}

function inp(val,onChange,extra={}){
  const el=document.createElement("input");
  el.className="";
  Object.assign(el,{value:val||"",...extra});
  el.addEventListener("input",e=>onChange(e.target.value));
  return el;
}

function renderJobCard(job){
  const isOpen=state.open===job.id;
  const isDel=state.delConfirm===job.id;
  const expTotal=xp(job);
  const profit=(+job.received)-expTotal;

  const head=h("div",{className:"card-head",onClick:()=>setState({open:isOpen?null:job.id,delConfirm:null})},[
    h("div",{style:{flex:1,minWidth:0,marginRight:8}},[
      h("div",{style:{fontWeight:700,fontSize:"15px",color:"#f1f5f9",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},job.name),
      h("div",{style:{fontSize:"12px",color:"#475569",marginTop:3}},job.client+(job.client?" · ":"")+job.date)
    ]),
    h("div",{style:{display:"flex",alignItems:"center",gap:6,flexShrink:0}},[
      h("span",{className:"badge",style:{background:SC[job.status]+"28",color:SC[job.status]}},job.status),
      h("span",{className:"chip",style:{color:profit>=0?"#34d399":"#f87171",background:profit>=0?"#34d39918":"#f8717118"}},(profit>=0?"+":"−")+"$"+fmt(Math.abs(profit))),
      h("span",{style:{fontSize:"22px",color:"#475569",lineHeight:1,transition:"transform .2s",display:"inline-block",transform:isOpen?"rotate(90deg)":"none"}},"›")
    ])
  ]);

  const card=h("div",{className:"card"},[head]);

  if(isOpen){
    const ae=state.addExp;

    // profit box
    const pbox=h("div",{className:"pbox"},[
      ...[["報價金額",+job.quote,"#cbd5e1",false],["已收款",+job.received,"#34d399",false],["總支出",expTotal,"#f87171",true]].map(([l,v,c,m])=>
        h("div",{style:{display:"flex",justifyContent:"space-between",padding:"5px 0"}},[
          h("span",{style:{fontSize:"12px",color:"#64748b"}},l),
          h("span",{style:{fontSize:"14px",fontWeight:700,color:c}},(m?"−":"")+"$"+fmt(v))
        ])
      ),
      h("div",{style:{height:"1px",background:"#1e293b",margin:"8px 0"}}),
      h("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"center"}},[
        h("span",{style:{fontSize:"13px",color:"#94a3b8"}},"淨利潤"),
        h("span",{style:{fontSize:"20px",fontWeight:900,color:profit>=0?"#34d399":"#fb923c"}},(profit>=0?"+":"−")+"$"+fmt(Math.abs(profit)))
      ]),
      +job.quote>0?h("div",{style:{textAlign:"right",fontSize:"11px",color:"#475569",marginTop:3}},"利潤率 "+Math.round(profit/(+job.quote)*100)+"%"):null
    ]);

    // edit fields
    const qInp=document.createElement("input");qInp.value=job.quote||"";qInp.type="number";qInp.placeholder="0";qInp.addEventListener("input",e=>{job.quote=e.target.value;setJobs([...state.jobs])});
    const rInp=document.createElement("input");rInp.value=job.received||"";rInp.type="number";rInp.placeholder="0";rInp.addEventListener("input",e=>{job.received=e.target.value;setJobs([...state.jobs])});

    const stRow=h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:14}},
      STATUS.map(st=>h("div",{
        className:"st-btn",
        style:job.status===st?{background:SC[st]+"30",color:SC[st],borderColor:SC[st]}:{},
        onClick:()=>{job.status=st;setJobs([...state.jobs])}
      },st))
    );

    // expenses
    const exps=job.exps||[];
    const expLines=exps.map(e=>h("div",{className:"exp-line"},[
      h("span",{style:{fontSize:"10px",color:"#60a5fa",background:"#60a5fa18",borderRadius:"4px",padding:"2px 7px",whiteSpace:"nowrap",fontWeight:700}},e.cat),
      h("span",{style:{flex:1,fontSize:"12px",color:"#94a3b8",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},e.cat==="人工"&&e.qty&&e.unitPrice?(e.desc?e.desc+"・":"")+e.qty+"人×$"+fmt(e.unitPrice):e.desc||"—"),
      h("span",{style:{fontSize:"13px",fontWeight:800,color:"#fca5a5",whiteSpace:"nowrap"}},"$"+fmt(e.amt)),
      h("div",{style:{color:"#475569",fontSize:"13px",padding:"4px 8px",cursor:"pointer"},onClick:()=>{job.exps=exps.filter(x=>x.id!==e.id);setJobs([...state.jobs])}},  "✕")
    ]));

    // add expense row
    const catSel=document.createElement("select");
    catSel.style.cssText="padding:8px 9px;font-size:13px;width:68px;flex:none;background:#0f172a;border:1px solid #1e293b;border-radius:9px;color:#e2e8f0";
    CATS.forEach(c=>{const o=document.createElement("option");o.value=c;o.textContent=c;if(c===ae.cat)o.selected=true;catSel.appendChild(o)});
    catSel.addEventListener("change",e=>setState({addExp:{...ae,cat:e.target.value,amt:"",qty:"",unitPrice:""}}));

    const descInp=document.createElement("input");
    descInp.placeholder="說明（選填）";descInp.value=ae.desc||"";
    descInp.style.cssText="padding:8px 9px;font-size:13px;flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:9px;color:#e2e8f0";
    descInp.addEventListener("input",e=>setState({addExp:{...ae,desc:e.target.value}}));

    const addRow1=h("div",{style:{display:"flex",gap:5}},[catSel,descInp]);

    if(ae.cat!=="人工"){
      const amtInp=document.createElement("input");
      amtInp.type="number";amtInp.placeholder="金額";amtInp.value=ae.amt||"";
      amtInp.style.cssText="padding:8px 9px;font-size:13px;width:80px;flex:none;background:#0f172a;border:1px solid #1e293b;border-radius:9px;color:#e2e8f0";
      amtInp.addEventListener("input",e=>setState({addExp:{...ae,amt:e.target.value}}));
      addRow1.appendChild(amtInp);
    }

    const addBtn=h("div",{style:{background:"#3b82f6",color:"#fff",borderRadius:"8px",width:"36px",height:"36px",fontSize:"22px",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0},
      onClick:()=>{
        let amt=ae.amt;
        if(ae.cat==="人工"){if(!ae.qty||!ae.unitPrice)return;amt=String(+ae.qty * +ae.unitPrice);}
        else{if(!amt)return;}
        job.exps=[...(job.exps||[]),{id:uid(),cat:ae.cat,desc:ae.desc,amt,qty:ae.qty,unitPrice:ae.unitPrice}];
        setJobs([...state.jobs]);
        setState({addExp:{cat:ae.cat,desc:"",amt:"",qty:"",unitPrice:""}});
      }},"+");
    addRow1.appendChild(addBtn);

    let addRow2=null;
    if(ae.cat==="人工"){
      const qtyInp=document.createElement("input");qtyInp.type="number";qtyInp.placeholder="人數";qtyInp.value=ae.qty||"";
      qtyInp.style.cssText="padding:8px 9px;font-size:13px;flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:9px;color:#e2e8f0";
      qtyInp.addEventListener("input",e=>setState({addExp:{...ae,qty:e.target.value}}));
      const upInp=document.createElement("input");upInp.type="number";upInp.placeholder="單價 $";upInp.value=ae.unitPrice||"";
      upInp.style.cssText="padding:8px 9px;font-size:13px;flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:9px;color:#e2e8f0";
      upInp.addEventListener("input",e=>setState({addExp:{...ae,unitPrice:e.target.value}}));
      addRow2=h("div",{style:{display:"flex",gap:5,alignItems:"center",marginTop:6}},[
        qtyInp,
        h("span",{style:{color:"#475569",fontSize:"15px",flexShrink:0}},"×"),
        upInp,
        h("div",{style:{fontSize:"12px",fontWeight:800,color:"#34d399",flexShrink:0,minWidth:"58px",textAlign:"right"}},"= $"+fmt((+ae.qty||0)*(+ae.unitPrice||0)))
      ]);
    }

    const expSec=h("div",{className:"exp-sec"},[
      h("div",{style:{fontSize:"11px",color:"#475569",marginBottom:8,fontWeight:700}},"📌 費用明細"),
      ...(exps.length===0?[h("div",{style:{fontSize:"12px",color:"#334155",padding:"4px 0 8px"}},"尚無費用記錄")]:[]),
      ...expLines,
      exps.length>0?h("div",{style:{textAlign:"right",fontSize:"12px",color:"#f87171",fontWeight:700,padding:"6px 0 2px",borderTop:"1px solid #1e293b",marginTop:4}},"合計 $"+fmt(expTotal)):null,
      h("div",{style:{marginTop:10}},[addRow1,addRow2].filter(Boolean))
    ]);

    // delete
    const delEl=isDel?
      h("div",{className:"del-confirm"},[
        h("span",{style:{flex:1,fontSize:"14px",color:"#f87171",fontWeight:700}},"確定刪除？"),
        h("div",{style:{background:"#f87171",color:"#fff",borderRadius:"10px",padding:"12px 22px",fontSize:"15px",fontWeight:800,cursor:"pointer"},onClick:()=>{setJobs(state.jobs.filter(j=>j.id!==job.id));setState({open:null,delConfirm:null})}},"確定"),
        h("div",{style:{background:"#334155",color:"#cbd5e1",borderRadius:"10px",padding:"12px 16px",fontSize:"15px",cursor:"pointer"},onClick:()=>setState({delConfirm:null})},"取消")
      ]):
      h("div",{className:"del-btn",onClick:()=>setState({delConfirm:job.id})},[
        h("span",{style:{fontSize:"16px"}},"🗑"),
        h("span",{style:{color:"#f87171",fontSize:"14px",fontWeight:700}},"刪除此工單")
      ]);

    const body=h("div",{className:"card-body"},[pbox,
      h("div",{className:"row2"},[FL("報價金額 $",qInp),FL("已收款 $",rInp)]),
      stRow,expSec,delEl
    ]);
    card.appendChild(body);
  }
  return card;
}

function render(){
  const jobs=Array.isArray(state.jobs)?state.jobs:[];
  const tQ=jobs.reduce((s,j)=>s+(+j.quote||0),0);
  const tI=jobs.reduce((s,j)=>s+(+j.received||0),0);
  const tO=jobs.reduce((s,j)=>s+xp(j),0);
  const tP=tI-tO;
  const tPend=jobs.filter(j=>j.status!=="完收").reduce((s,j)=>s+Math.max(0,(+j.quote||0)-(+j.received||0)),0);
  const filtered=state.filter==="全部"?jobs:jobs.filter(j=>j.status===state.filter);

  const app=document.getElementById("app");
  app.innerHTML="";

  // topbar
  app.appendChild(h("div",{className:"topbar"},[
    h("div",{},[
      h("div",{style:{fontSize:"15px",fontWeight:900,color:"#f1f5f9"}},"安潔國際有限公司"),
      h("div",{style:{display:"flex",alignItems:"center",gap:6,marginTop:2}},[
        h("div",{style:{fontSize:"10px",color:"#475569"}},"工程記帳系統"),
        h("div",{style:{fontSize:"10px",borderRadius:"20px",padding:"2px 7px",fontWeight:600,...(state.syncing?{background:"#f59e0b22",color:"#f59e0b"}:{background:"#34d39922",color:"#34d399"})}},state.syncing?"⟳ 同步中":"● 已同步")
      ])
    ]),
    h("button",{className:"btn-primary",onClick:()=>{
      setState({draft:{id:uid(),name:"",client:"",date:today(),quote:"",received:"",status:"待收",exps:[],note:""},adding:true,tab:"工單"});
      setTimeout(()=>{const el=document.getElementById("new-job-name");if(el)el.focus()},100);
    }},"＋ 新工單")
  ]));

  // tabs
  app.appendChild(h("div",{className:"tabs"},
    ["總覽","工單","統計"].map(t=>h("button",{className:"tab"+(state.tab===t?" active":""),onClick:()=>setState({tab:t})},(t==="總覽"?"📊":t==="工單"?"📋":"📈")+" "+t))
  ));

  const body=h("div",{className:"body"});

  if(state.tab==="總覽"){
    body.appendChild(h("div",{className:"hero"},[
      h("div",{style:{fontSize:"12px",color:"#94a3b8",marginBottom:6}},"本期淨利潤"),
      h("div",{style:{fontSize:"38px",fontWeight:900,color:tP>=0?"#34d399":"#fb923c"}},(tP>=0?"+":"−")+"$"+fmt(Math.abs(tP))),
      tQ>0?h("div",{style:{fontSize:"12px",color:"#475569",marginTop:4}},"利潤率 "+Math.round(tP/tQ*100)+"% · 共 "+jobs.length+" 筆"):null
    ].filter(Boolean)));
    body.appendChild(h("div",{className:"stat-grid"},
      [["📝","總報價",tQ,"#cbd5e1"],["✅","已收款",tI,"#34d399"],["💸","總支出",tO,"#f87171"],["⏳","待收款",tPend,"#f59e0b"]].map(([icon,label,val,color])=>
        h("div",{className:"stat-card"},[
          h("div",{style:{fontSize:"11px",color:"#475569",marginBottom:5}},icon+" "+label),
          h("div",{style:{fontSize:"17px",fontWeight:800,color}},"$"+fmt(val))
        ])
      )
    ));
    if(jobs.length===0){
      body.appendChild(h("div",{style:{textAlign:"center",padding:"60px 0",color:"#475569"}},[
        h("div",{style:{fontSize:"48px",marginBottom:14}},"🧹"),
        h("div",{style:{marginBottom:20}},"尚無工單記錄"),
        h("button",{className:"btn-primary",style:{padding:"13px 32px",fontSize:"15px"},onClick:()=>{
          setState({draft:{id:uid(),name:"",client:"",date:today(),quote:"",received:"",status:"待收",exps:[],note:""},adding:true,tab:"工單"});
        }},"＋ 建立第一筆工單")
      ]));
    }
  }

  if(state.tab==="工單"){
    if(state.adding&&state.draft){
      const d=state.draft;
      const nameInp=document.createElement("input");nameInp.id="new-job-name";nameInp.placeholder="例：台中市後細清";nameInp.value=d.name||"";
      nameInp.addEventListener("input",e=>Object.assign(state.draft,{name:e.target.value}));
      const clientInp=document.createElement("input");clientInp.placeholder="業主/工班";clientInp.value=d.client||"";
      clientInp.addEventListener("input",e=>Object.assign(state.draft,{client:e.target.value}));
      const dateInp=document.createElement("input");dateInp.type="date";dateInp.value=d.date||"";
      dateInp.addEventListener("input",e=>Object.assign(state.draft,{date:e.target.value}));
      const quoteInp=document.createElement("input");quoteInp.type="number";quoteInp.placeholder="0";quoteInp.value=d.quote||"";
      quoteInp.addEventListener("input",e=>Object.assign(state.draft,{quote:e.target.value}));
      const recInp=document.createElement("input");recInp.type="number";recInp.placeholder="0";recInp.value=d.received||"";
      recInp.addEventListener("input",e=>Object.assign(state.draft,{received:e.target.value}));

      const form=h("div",{className:"add-form"},[
        h("div",{style:{fontSize:"14px",fontWeight:800,color:"#94a3b8",marginBottom:14}},"✦ 新增工單"),
        FL("工程名稱（必填）",nameInp),
        h("div",{className:"row2"},[FL("客戶名稱",clientInp),FL("施工日期",dateInp)]),
        h("div",{className:"row2"},[FL("報價 $",quoteInp),FL("已收款 $",recInp)]),
        FL("狀態",h("div",{style:{display:"flex",gap:6,flexWrap:"wrap"}},
          STATUS.map(st=>h("div",{className:"st-btn",style:d.status===st?{background:SC[st]+"30",color:SC[st],borderColor:SC[st]}:{},onClick:()=>{state.draft.status=st;render()}},st))
        )),
        h("div",{style:{display:"flex",gap:8,marginTop:14}},[
          h("div",{className:"btn-save",onClick:()=>{
            if(!state.draft.name.trim()){document.getElementById("new-job-name")&&document.getElementById("new-job-name").focus();return;}
            setJobs([{...state.draft},...state.jobs]);
            setState({adding:false,draft:null});
          }},"✓ 儲存"),
          h("div",{className:"btn-cancel",onClick:()=>setState({adding:false,draft:null})},"取消")
        ])
      ]);
      body.appendChild(form);
    }
    if(!state.adding){
      const filterRow=h("div",{style:{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}},
        ["全部",...STATUS].map(f=>h("div",{className:"filter-chip"+(state.filter===f?" active":""),onClick:()=>setState({filter:f})},
          f+"（"+(f==="全部"?jobs.length:jobs.filter(j=>j.status===f).length)+"）"
        ))
      );
      body.appendChild(filterRow);
    }
    if(filtered.length===0&&!state.adding){
      body.appendChild(h("div",{style:{textAlign:"center",padding:"60px 0",color:"#475569"}},[h("div",{style:{fontSize:"36px",marginBottom:10}},"📋"),"沒有符合的工單"]));
    }
    filtered.forEach(job=>body.appendChild(renderJobCard(job)));
  }

  if(state.tab==="統計"){
    body.appendChild(h("div",{className:"sec-title"},"收支總覽"));
    body.appendChild(h("div",{style:{display:"flex",gap:5,alignItems:"stretch",marginBottom:4}},
      [["總收款",tI,"#34d399"],["總支出",tO,"#f87171"],["淨利潤",tP,tP>=0?"#34d399":"#fb923c"]].map(([l,v,c],i)=>
        h("div",{style:{flex:1,background:"#1e293b",borderRadius:"12px",padding:"12px 8px",textAlign:"center",...(i===2?{border:"1px solid "+c+"30"}:{})}},[
          h("div",{style:{fontSize:"10px",color:"#475569",marginBottom:4}},l),
          h("div",{style:{fontSize:"17px",fontWeight:900,color:c}},(v<0?"−":"")+"$"+fmt(Math.abs(v)))
        ])
      )
    ));
    if(jobs.length>0){
      body.appendChild(h("div",{className:"sec-title"},"各工單利潤"));
      const tbl=h("div",{style:{background:"#1e293b",borderRadius:"12px",overflow:"hidden"}});
      tbl.appendChild(h("div",{style:{display:"flex",gap:4,padding:"8px 12px",background:"#0f172a",fontSize:"10px",color:"#475569",fontWeight:700}},[
        h("span",{style:{flex:1}},"工程名稱"),h("span",{style:{width:58,textAlign:"right"}},"收款"),h("span",{style:{width:58,textAlign:"right"}},"支出"),h("span",{style:{width:66,textAlign:"right"}},"利潤")
      ]));
      jobs.forEach(job=>{
        const e=xp(job),p=(+job.received||0)-e;
        tbl.appendChild(h("div",{style:{display:"flex",gap:4,padding:"10px 12px",borderTop:"1px solid #0f172a",alignItems:"center"}},[
          h("div",{style:{flex:1,minWidth:0}},[
            h("div",{style:{fontSize:"13px",color:"#e2e8f0",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}},job.name),
            h("div",{style:{fontSize:"10px",color:"#475569"}},job.date)
          ]),
          h("span",{style:{width:58,textAlign:"right",fontSize:"12px",color:"#34d399"}},fmt(+job.received||0)),
          h("span",{style:{width:58,textAlign:"right",fontSize:"12px",color:"#f87171"}},fmt(e)),
          h("span",{style:{width:66,textAlign:"right",fontSize:"13px",fontWeight:800,color:p>=0?"#38bdf8":"#fb923c"}},(p>=0?"+":"−")+fmt(Math.abs(p)))
        ]));
      });
      tbl.appendChild(h("div",{style:{display:"flex",gap:4,padding:"10px 12px",borderTop:"2px solid #334155",background:"#0f172a",alignItems:"center"}},[
        h("div",{style:{flex:1,fontSize:"13px",fontWeight:800,color:"#94a3b8"}},"合計"),
        h("span",{style:{width:58,textAlign:"right",fontSize:"13px",fontWeight:800,color:"#34d399"}},fmt(tI)),
        h("span",{style:{width:58,textAlign:"right",fontSize:"13px",fontWeight:800,color:"#f87171"}},fmt(tO)),
        h("span",{style:{width:66,textAlign:"right",fontSize:"14px",fontWeight:900,color:tP>=0?"#38bdf8":"#fb923c"}},(tP>=0?"+":"−")+fmt(Math.abs(tP)))
      ]));
      body.appendChild(tbl);
    }else{
      body.appendChild(h("div",{style:{textAlign:"center",padding:"60px 0",color:"#475569"}},[h("div",{style:{fontSize:"40px",marginBottom:12}},"📈"),"新增工單後即可查看統計"]));
    }
  }

  app.appendChild(body);
}

// Init
apiLoad().then(jobs=>{
  state.jobs=jobs;state.loading=false;render();
  setInterval(()=>apiLoad().then(d=>{if(JSON.stringify(d)!==JSON.stringify(state.jobs)){state.jobs=d;render();}}),15000);
});
</script>
</body>
</html>
